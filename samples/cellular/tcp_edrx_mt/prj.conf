# TF-M (required for the *_ns board target)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_NCS_SAMPLES_DEFAULTS=y

# Logging — full deferred mode (timestamps + colors).
# NCS_SAMPLES_DEFAULTS implies LOG_DEFAULT_MINIMAL (no prompt), which only defaults the
# LOG_MODE choice to minimal; explicitly select deferred to override it.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Networking / sockets offloaded to the modem
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Modem library + LTE link control
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_EDRX_MODULE=y

# Force LTE-M (matches the field config AT%XSYSTEMMODE=1,0,1,0)
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# eDRX: request a 61.44 s cycle with a 2.56 s PTW for LTE-M (matches the field setup).
#   eDRX value "0100" = 61.44 s, PTW value "0001" = 2.56 s  (3GPP TS 24.008 WB-S1 tables)
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0100"
CONFIG_LTE_PTW_VALUE_LTE_M="0001"

# PSM is intentionally NOT requested: we want the UE reachable via paging in eDRX
# between server pushes. (PSM would make it unreachable until the next TAU.)

# Modem trace — capture with the Cellular Monitor app over the DK trace UART.
CONFIG_NRF_MODEM_LIB_TRACE=y

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
